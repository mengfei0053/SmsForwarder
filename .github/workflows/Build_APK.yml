name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Resolve build type
        id: bt
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ -z "$BT" ]; then BT=debug; fi
          echo "build_type=$BT" >> "$GITHUB_OUTPUT"
          echo "Using build_type=$BT"

      - name: Prepare release keystore from secrets
        if: steps.bt.outputs.build_type == 'release'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] \
             || [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing release signing secrets (SIGNING_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)"
            exit 1
          fi
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/smsforwarder-release.jks
          # storeFile is resolved via file() in app/build.gradle → relative to app/
          printf '%s\n' \
            'storeFile=../keystore/smsforwarder-release.jks' \
            "storePassword=${SIGNING_STORE_PASSWORD}" \
            "keyAlias=${SIGNING_KEY_ALIAS}" \
            "keyPassword=${SIGNING_KEY_PASSWORD}" \
            > keystore/keystore.properties
          # sanity: list aliases without printing passwords
          keytool -list -keystore keystore/smsforwarder-release.jks \
            -storepass "$SIGNING_STORE_PASSWORD" | head -20
          echo "keystore.properties keys present (values redacted):"
          cut -d= -f1 keystore/keystore.properties

      - name: Create debug keystore
        if: steps.bt.outputs.build_type != 'release'
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/debug.jks \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SmsForwarder Debug,O=mengfei0053,C=CN"
          printf '%s\n' \
            'storeFile=../keystore/debug.jks' \
            'storePassword=android' \
            'keyAlias=androiddebugkey' \
            'keyPassword=android' \
            > keystore/keystore.properties

      - name: Tune Gradle for CI
        run: |
          # GitHub-hosted runners ~7GB RAM; upstream asks for 16g
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          # avoid preBuild clean on CI
          sed -i 's/isNeedClean=.*/isNeedClean=false/' gradle.properties
          # use keystore/keystore.properties signingConfigs
          sed -i 's/isNeedPackage=.*/isNeedPackage=true/' gradle.properties
          # Keep only aliyun "public" (hosts jcenter leftovers). Drop aliyun
          # google/central mirrors — they 502/404 and break Gradle resolution.
          sed -i '/maven.aliyun.com\/repository\/google/d' build.gradle
          sed -i '/maven.aliyun.com\/repository\/central/d' build.gradle
          # ensure public mirror exists once
          if ! grep -q 'maven.aliyun.com/repository/public' build.gradle; then
            sed -i "/mavenCentral()/a\        maven { url 'https://maven.aliyun.com/repository/public' }" build.gradle
          fi
          echo "---- repositories (build.gradle) ----"
          grep -n "maven\|google\|jitpack" build.gradle || true
          echo "---- gradle.properties ----"
          cat gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          BT="${{ steps.bt.outputs.build_type }}"
          if [ "$BT" = "release" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: List outputs
        if: always()
        run: |
          find build/app/outputs -type f -name '*.apk' 2>/dev/null | sort || true
          ls -lah build/app/outputs/apk/*/ 2>/dev/null || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmsForwarder-APKs-${{ steps.bt.outputs.build_type }}
          path: |
            build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
